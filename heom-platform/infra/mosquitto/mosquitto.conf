# Modelo de broker Mosquitto nativo. Ajuste os caminhos para a instalação local.
# Não exponha o broker à rede de usuários sem autenticação e ACL.
listener 1883 127.0.0.1
allow_anonymous false
persistence true
persistence_location C:/ProgramData/mosquitto/data/
log_dest file C:/ProgramData/mosquitto/log/mosquitto.log
password_file C:/ProgramData/mosquitto/passwd
acl_file C:/ProgramData/mosquitto/acl
